name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'apk-app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Install dependencies in apk-app
        working-directory: apk-app
        run: npm install

      - name: Sync Capacitor Android
        working-directory: apk-app
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x apk-app/android/gradlew

      - name: Build Debug APK with Gradle
        working-directory: apk-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-tracker.apk
          path: apk-app/android/app/build/outputs/apk/debug/app-debug.apk
